  (https://lists.gnu.org/archive/html/qemu-devel/2012-02/msg02865.html;
  QEMU's ui/icons/qemu.svg), under CC BY 3.0
  (https://creativecommons.org/licenses/by/3.0/). Changes: Kew's head and
  neck taken from that file, enlarged and cut at the tile's edge, without
  his Q, and placed behind a dark glass tile drawn for vitrine. This file is
  under CC BY 3.0 as well. vitrine is not affiliated with or endorsed by the
  QEMU project.
-->
