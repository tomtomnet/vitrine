      <cc:Work rdf:about="">
        <dc:format>image/svg+xml</dc:format>
        <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
        <dc:title>vitrine</dc:title>
        <dc:description>vitrine's logo: QEMU's emu, Kew, on his Q behind a glass pane. Derived from Kew the Angry Emu by Benoît Canet (QEMU Community), CC BY 3.0. Changes: Kew and his Q taken from that file and scaled, without the Q's gloss, and placed behind a glass pane drawn for vitrine.</dc:description>
        <dc:creator>
          <cc:Agent>
            <dc:title>Benoît Canet (Kew the Angry Emu), adapted by the vitrine project</dc:title>
          </cc:Agent>
        </dc:creator>
        <dc:source>https://lists.gnu.org/archive/html/qemu-devel/2012-02/msg02865.html</dc:source>
        <cc:license rdf:resource="http://creativecommons.org/licenses/by/3.0/"/>
      </cc:Work>
    </rdf:RDF>
  </metadata>
