        <dc:title>vitrine</dc:title>
        <dc:description>vitrine's logo: QEMU's emu, Kew, behind a dark glass tile. Derived from Kew the Angry Emu by Benoît Canet (QEMU Community), CC BY 3.0. Changes: Kew's head and neck taken from that file, enlarged and cut at the tile's edge, without his Q, and placed behind a dark glass tile drawn for vitrine.</dc:description>
        <dc:creator>
