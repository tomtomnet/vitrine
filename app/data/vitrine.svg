<!--
  vitrine's logo: QEMU's emu, Kew, on his Q behind a glass pane. Derived
  from "Kew the Angry Emu" by Benoît Canet, published by the QEMU Community
  (https://lists.gnu.org/archive/html/qemu-devel/2012-02/msg02865.html;
  QEMU's ui/icons/qemu.svg), under CC BY 3.0
  (https://creativecommons.org/licenses/by/3.0/). Changes: Kew and his Q
  taken from that file and scaled, without the Q's gloss, and placed behind
  a glass pane drawn for vitrine. This file is under CC BY 3.0 as well.
  vitrine is not affiliated with or endorsed by the QEMU project.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
