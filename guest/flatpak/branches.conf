# The Flatpak runtimes vitrine's Mesa is built for (guest/build-flatpak.sh):
# freedesktop-sdk's GL extension of org.freedesktop.Platform, the one Flathub
# ships (org.freedesktop.Platform.GL.default), from freedesktop-sdk's own
# recipe at a commit of its release branch, with vitrine's guest Mesa patches.
# The KDE and GNOME runtimes are built on these and take the same extension.
#
# A [BRANCH] section each, the runtime's branch, then NAME=value lines:
#   commit   the commit of freedesktop-sdk's release/BRANCH built from:
#            freedesktop-sdk's cache has what its CI built of it, all but
#            Mesa comes from there
#   image    the BuildStream image of its CI at that commit (DOCKER_IMAGE_ID
#            in its .gitlab-ci.yml: the build stops on another)
#   mesa     the Mesa release that commit builds: none other is built, the
#            patches are for this one
#   patches  by their path in guest/, in the order they apply: the Xe native
#            context's for that Mesa, then those of vitrine's guest Mesa

