# What build-rpms.sh and build-medium.sh build, in the order they are
# built, as Vitrine's Builds window shows it.  The app reads this file;
# build-rpms.sh builds each section with a spec (its folder: the spec,
# the patches and sources beside it), build-medium.sh the medium.
#
# One [component] section each, then NAME=value lines, no quotes, no shell:
#   title          what the window calls it
#   spec           its spec, in its folder: a package of build-rpms.sh
#   kind=medium    the medium of build-medium.sh, made of the packages
#   patches        spec: the spec's PatchNNN lines, in their order; or a
#                  folder of *.patch files
#   order          a file naming the folder's patches in the order they
#                  apply (the others after them, by name)
#   origin         where its patches come from
#   origin.fedora  spec: where its patches numbered below 1000 come from
#                  (the distribution's own, in its spec); origin is then
#                  for Patch1000 and up
#   heavy=1        its build takes up to the container's memory cap: it
#                  waits until that much is free
#   deps           the medium: the packages it is made of; a package: those it
#                  is built against (build-rpms.sh installs their packages in
#                  its build's container, and their keys are in its inputs)
#   releases       the Fedora releases it is built for, as their numbers:
#                  "44" (every release without it); the medium of a release
#                  has those of its deps built for it

[tools]
title=vitrine-guest-tools
spec=tools/vitrine-guest-tools.spec
patches=tools/dkms/patches
order=tools/dkms/prepare.sh
origin=Research: the guest's virtio-gpu driver

[mesa]
title=Mesa
spec=mesa/mesa.spec
patches=spec
origin=Research
heavy=1

[kwin]
title=KWin
spec=kwin/kwin.spec
patches=spec
origin=Research
origin.fedora=Fedora
heavy=1
releases=44

[proxy]
title=wl-cross-domain-proxy
spec=proxy/wl-cross-domain-proxy.spec
patches=spec
origin=Research
releases=44

[kpipewire]
title=KPipeWire
spec=kpipewire/kpipewire.spec
patches=spec
origin=Research
origin.fedora=Fedora
releases=44

[qtbase]
title=Qt Base
spec=qtbase/qt6-qtbase.spec
patches=spec
origin=Research
origin.fedora=Fedora
heavy=1
releases=44

[ksvg]
title=KSvg
spec=ksvg/kf6-ksvg.spec
patches=spec
origin=Research
origin.fedora=Fedora
releases=44

[kirigami]
title=Kirigami
spec=kirigami/kf6-kirigami.spec
patches=spec
origin=Research
origin.fedora=Fedora
releases=44

[medium]
title=Guest tools medium
kind=medium
deps=tools mesa kwin proxy kpipewire qtbase ksvg kirigami
