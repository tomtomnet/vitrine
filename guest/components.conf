# What build-rpms.sh, build-flatpak.sh and build-medium.sh build, in the
# order they are built, as Vitrine's Builds window shows it.  The app reads
# this file; build-rpms.sh builds each section with a spec (its folder: the
# spec, the patches and sources beside it), build-flatpak.sh the Mesa for
# Flatpak apps (its folder flatpak/), build-medium.sh the medium.
#
# One [component] section each, then NAME=value lines, no quotes, no shell:
#   title          what the window calls it
#   spec           its spec, in its folder: a package of build-rpms.sh
#   kind=flatpak   the Mesa for Flatpak apps of build-flatpak.sh, which every
#                  Fedora release's medium carries
#   kind=medium    the medium of build-medium.sh, made of the packages
#   patches        spec: the spec's PatchNNN lines, in their order; or a
#                  folder of *.patch files
#   order          a file naming the folder's patches in the order they
#                  apply (the others after them, by name)
#   origin         where its patches come from
#   origin.fedora  spec: where its patches numbered below 1000 come from
#                  (the distribution's own, in its spec); origin is then
#                  for Patch1000 and up
#   heavy=1        its build takes up to the container's memory cap: it
#                  waits until that much is free
#   deps           the medium: the packages it is made of; a package: those it
#                  is built against (build-rpms.sh installs their packages in
#                  its build's container, and their keys are in its inputs)
#   releases       the Fedora releases it is built for, as their numbers:
#                  "44" (every release without it); the medium of a release
#                  has those of its deps built for it

[tools]
title=vitrine-guest-tools
spec=tools/vitrine-guest-tools.spec
patches=tools/dkms/patches
order=tools/dkms/prepare.sh
origin=Research: the guest's virtio-gpu driver

[mesa]
title=Mesa
spec=mesa/mesa.spec
patches=spec
origin=Research
heavy=1

[kwayland]
title=KWayland
spec=kwayland/kwayland.spec
patches=spec
origin=Research
origin.fedora=Fedora
releases=45

[kwin]
title=KWin
spec=kwin/kwin.spec
patches=spec
origin=Research
origin.fedora=Fedora
heavy=1
deps=kwayland
releases=45

[proxy]
title=wl-cross-domain-proxy
spec=proxy/wl-cross-domain-proxy.spec
patches=spec
origin=Research

[kpipewire]
title=KPipeWire
spec=kpipewire/kpipewire.spec
patches=spec
origin=Research
origin.fedora=Fedora
releases=45

[qtbase]
title=Qt Base
spec=qtbase/qt6-qtbase.spec
patches=spec
origin=Research
origin.fedora=Fedora
heavy=1

[ksvg]
title=KSvg
spec=ksvg/kf6-ksvg.spec
patches=spec
origin=Research
origin.fedora=Fedora
releases=45

[kirigami]
title=Kirigami
spec=kirigami/kf6-kirigami.spec
patches=spec
origin=Research
origin.fedora=Fedora
releases=45

# Fedora 44's medium keeps Plasma 6.8.2 and KDE Frameworks 6.31 (the
# research's sets for them, as on 2026-11-15) until Fedora 44's updates have
# Plasma 6.8.3 (its update FEDORA-2026-5cc225ea97 in updates-testing then):
# the guest's own Plasma and Frameworks must be of the same release.  These
# copies go then, and the packages above build for both releases again.
[kwayland-f44]
title=KWayland
spec=kwayland-f44/kwayland.spec
patches=spec
origin=Research
origin.fedora=Fedora
releases=44

[kwin-f44]
title=KWin
spec=kwin-f44/kwin.spec
patches=spec
origin=Research
origin.fedora=Fedora
heavy=1
deps=kwayland-f44
releases=44

[kpipewire-f44]
title=KPipeWire
spec=kpipewire-f44/kpipewire.spec
patches=spec
origin=Research
origin.fedora=Fedora
releases=44

[ksvg-f44]
title=KSvg
spec=ksvg-f44/kf6-ksvg.spec
patches=spec
origin=Research
origin.fedora=Fedora
releases=44

[kirigami-f44]
title=Kirigami
spec=kirigami-f44/kf6-kirigami.spec
patches=spec
origin=Research
origin.fedora=Fedora
releases=44

[mutter]
title=Mutter
spec=mutter/mutter.spec
patches=spec
origin=Research
origin.fedora=Fedora
releases=45

[flatpak]
title=Mesa for Flatpak apps
kind=flatpak
origin=Research
heavy=1

[medium]
title=Guest tools medium
kind=medium
deps=tools mesa kwayland kwin proxy kpipewire qtbase ksvg kirigami kwayland-f44 kwin-f44 kpipewire-f44 ksvg-f44 kirigami-f44 mutter flatpak
