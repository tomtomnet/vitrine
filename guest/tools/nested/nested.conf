# SPDX-License-Identifier: GPL-2.0-or-later
# Settings of the "Plasma (nested desktop)" session of vitrine's guest tools
# (the research's crosvm-desktop session; nested.md in
# /usr/share/doc/vitrine-guest-tools has what vitrine changed). Read by the
# session at login and by vitrine-nested-boot.service at boot, in
# nested-desktop boots only: vitrine says crosvm_desktop=1 through QEMU's
# fw_cfg when the VM's Nested desktop box is checked.

# Size of the window on the host, in logical (scaled) pixels. The nested
# desktop follows when you resize, maximize or full-screen the window. On a
# smaller host screen the window starts smaller, its shape kept: at most 90 % of
# the host's smallest screen.
CROSVM_DESKTOP_WIDTH=1600
CROSVM_DESKTOP_HEIGHT=900
# Scale of the window's frames until its size changes (the nested KWin takes the
# host's scale only with a new window size): auto = the host screen's scale (the
# largest of several), read from the host at login; or a number (2, 1.5, ...).
CROSVM_DESKTOP_SCALE=auto
# 1 = start full screen
CROSVM_DESKTOP_FULLSCREEN=0

# 1 = the window captures the host's keyboard shortcuts (Meta, Alt+Tab, ...)
# while it has the keyboard focus, like a VM window. The chord below releases
# them until the window gets the focus again (click another window, or use a
# host shortcut such as Alt+Tab, and come back). While released, the window
# title ends with "host shortcuts (refocus to capture)". Right Ctrl (grab the
# pointer) also captures them, as before. 0 = the host keeps its shortcuts.
CROSVM_DESKTOP_CAPTURE_SHORTCUTS=1
# Modifiers ctrl, shift, alt, meta and one key (esc, pause, f12, a, ...).
# Default: KDE's own chord for releasing captured input.
CROSVM_DESKTOP_RELEASE_CHORD=meta+shift+esc

# 1 = the proxy waits until the guest has finished drawing a GPU buffer
# before the host may show it (the host cannot see the guest's GPU fences:
# without this, frames flash half-drawn or transparent). 0 = off (debugging).
CROSVM_DESKTOP_FENCE_WAIT=1

# 1 = no AMD DCC layouts for the desktop's own output buffers (the proxy hides them
# from the nested KWin), so that in full screen the host can put the guest's
# frames straight on the screen instead of compositing them; Intel GPUs are not
# affected. 0 = the layout radeonsi prefers (DCC: the host composites).
# 2 = (2026-10-13, being measured) only the DCC layouts the display cannot read are
# hidden: the nested KWin renders compressed (DCC_RETILE, like the host's own screen
# buffers) and the host can still put its frames on the screen.
CROSVM_DESKTOP_DROP_DCC=1
# 1 = the desktop's window is declared opaque to the host: KWin renders it with an
# alpha channel without saying it has no transparency, and the host then puts it
# straight on the screen only once it updates quickly (the first frames after a
# key press were composited). 0 = as KWin sends it.
CROSVM_DESKTOP_OPAQUE=1

# The clipboard between the host and this desktop, like VM tools:
#   focus = text and images (PNG): what you copy on the host reaches this desktop when
#           you click into its window (and while it has the focus); what you copy here
#           reaches the host only if you copied it while the window had the focus
#   text  = the same, text only
#   off   = no clipboard between them
CROSVM_DESKTOP_CLIPBOARD=focus

# Live numbers in the window title, over the last second, updated twice a second:
#   title  = "... — 240 fps · 5.1 ms · input 9.8 ms": frames shown per second,
#            median frame latency, median input latency (while you type or move
#            the pointer), and "N dropped" when frames were discarded
#   detail = median/p99 of each, frames committed, and the proxy's hold
#   off
# frame latency: the guest's frame reaching the proxy -> on the host's screen;
# input latency: a key or pointer event of the host reaching the proxy -> the
# next frame on the host's screen. Summaries also go to the user journal
# (journalctl --user -t crosvm-desktop-proxy, every minute).
# vitrine: off, as the research's own guests
CROSVM_DESKTOP_STATS=off
# A stats overlay inside the desktop, like Looking Glass's: this chord shows and hides it
# (top left, click-through): FPS = frames the host presented per second, UPS = frames the
# guest committed, frame and input latency (median, p99), frames dropped, and graphs of the
# last frames' intervals (host presentations, guest commits; a refresh shown twice is a bar
# twice as high). Its repaints add ~10 frames a second while shown. Its last key never
# reaches the guest. none = no overlay.
CROSVM_DESKTOP_OVERLAY_CHORD=ctrl+alt+s
# One CSV row per frame, for offline analysis: an absolute path, or relative to
# your home; rewritten at every login. Empty: no log.
CROSVM_DESKTOP_STATS_LOG=

# 1 = the nested KWin composites on the CPU and sends shared-memory buffers
# (fallback if the host cannot import the guest's GPU buffers). Apps still
# render on the GPU.
CROSVM_DESKTOP_SOFTWARE=0

# Logging in is the guest's own business: vitrine sets no automatic login. When the
# guest's login screen logs a user into Plasma by itself (System Settings > Login
# Screen), a nested-desktop boot logs that user into this session instead.

# KWin environment variables (from ~/.config/environment.d and the like) that the
# nested KWin of this session should not get, separated by spaces: settings made
# for KWin driving a VM display, e.g.
#   KWIN_RENDER_JOURNAL_VARIANCE_TIME_MS KWIN_FRAME_SLACK_US KWIN_SWAPCHAIN_WAIT_READERS
CROSVM_DESKTOP_KWIN_UNSET=

# 1 = nested KWin may put guest windows on overlay layers (subsurfaces above its
# output). Off by default: with them the nested desktop sometimes stopped drawing
# when a window opened (host KWin 6.8, 2026-10-06); without them no cost was measured.
CROSVM_DESKTOP_NESTED_OVERLAYS=0

# KWin settings for this session's KWin only, on top of the guest's (VAR=VALUE, space-separated).
# (vitrine: its KWin 6.7.5 has the first one, KWIN_RENDER_JOURNAL_VARIANCE_TIME_MS; the others need
# the research's KWin sets for Plasma 6.7.91 and 6.8, and any other KWin ignores them.)
# The defaults: forget a slow frame within ~0.1 s (the guest's own value, tuned for a VM display,
# kept it for ~1 s and made the nested desktop start frames far too early afterwards); take the
# host's commit deadline from presentation-time v3 where the host sends it (KWIN_WAYLAND_DEADLINE=1;
# research host KWin builds only, others never send it); and stamp each frame with its target vblank
# (commit-timing, KWIN_WAYLAND_COMMIT_TIMING=1; KWin builds with the research port 0027 - other
# builds ignore it), so the host shows it then and not a refresh early: 99.7 % of frames on target,
# and no refresh left empty after an animation's first frames - without it a third of the launcher's
# openings had one (2026-10-10 ge2: 0 in 40 vs ~14 in 40). With guest KWin 6.7.91-1.g20+, =1 means
# auto: the stamps start only once the host has sent a commit deadline (presentation-time v3: the
# research host KWin builds, hl and later). A stock KWin 6.8 host sends none, so there the frames go
# unstamped - stamps could hold the nested desktop at half its rate on such a host, and it shows no
# frame early anyway (ct2/se1, research/commit-timing-holes-2026-10-10.md). =always stamps on any
# host. With an older research guest KWin (g5-g19, where 1 = always) on a stock host, remove it.
# Commit-timing needs a guest KWin with port 0028 as well (6.7.91-1.g5 or later): with g4 the
# nested desktop could stay at half rate for the rest of the session after fast window operations
# (its Wayland backend paired presentation feedback with frames by order, and commit-timing makes
# them come out of order; research/crosvm-half-rate-2026-10-07) - with g4, set it to 0.
# KWIN_STEADY_ANIMATION_CLOCK=1 (guest KWin g12+): after a missed frame an animation pauses instead
# of jumping, and KWin effects run at their designed length (2026-10-08, the user kept it)
# KWIN_ANIMATION_START_STEP=1 (guest KWin g15+): an effect animation's first frame is already one
# refresh in - at 0 it showed the state before the animation, the same image again: the launcher
# opens 5.4 ms and closes 3.1 ms sooner at 240 Hz (2026-10-09, 10 boots; window operations unchanged)
# KWIN_LONE_FRAME_LEAD_US=2500 (guest KWin g17+): a lone frame - the first after an idle stretch: a
# key, a click - is aimed at the next host refresh when that is at least 2.5 ms away and rendered at
# once, not planned two refreshes ahead: the minimal client's key -> screen at bare metal (9.4-9.5 vs
# 11.0 ms over the refresh phase, bare 9.3-9.4) and no more "slow" sessions; animations unchanged
# except ~3 extra repeats in 52 launcher animations with the host GPU 40 % busy (2026-10-09,
# research/guest-client-overhead-2026-10-09.md). Remove it to go back.
# KWIN_ASYNC_CURSOR_MOVES=1 (guest KWin g18+): a pointer move no longer wakes the nested KWin's render
# loop for an empty frame - each one used to be committed to the host and took the next refresh
# before the moved window's frame (host frames per 80 pointer moves over the VM: 150 -> 56;
# 2026-10-10, research/drag-fix-2026-10-10.md). Remove it to go back.
# KWIN_QUICKEFFECT_COMPOSITE=1 (guest KWin g21g+, patch 0050; opt-in): while the Overview (or another QML
# effect) is open the nested KWin composites it into its own screen buffers instead of handing the effect's
# buffers to the host - those are new at every opening (5 per opening: an import, a framebuffer, an atomic
# test each on the host) and 8-bit against the desktop's 10-bit frames (a plane format change: an amdgpu full
# update). It costs the guest one more screen-sized pass per frame. On the laptop (Radeon 780M, 1920x1200 at
# 144 Hz) the host's late frames per 10 openings 10-15 -> 2-11, steady motion ~78 -> 65-78 ms (runs
# ovc1/ovf3, findings/laptop-4k240-2026-10-13.md); on the desktop (RX 6900 XT, 4K at 240 Hz) it was worse:
# still refreshes at the animation's start 2-4 -> 11, steady motion 43 -> 47-51 ms, the guest's GPU time per
# opening 50-55 -> 121-123 ms, while that host was never late either way (run ovd1, 2026-10-13 night). Add it
# where the host pays more for the effect's new buffers than the guest for the extra pass; older guest KWins
# ignore it.
# (KWIN_OFFSCREEN_SCANOUT_FORMAT=1, patch 0048: the effect's buffers in the desktop's format instead - tried
# that day, weaker; KWIN_OFFSCREEN_SWAPCHAIN_POOL_MS: its buffers kept across openings - no visible gain.)
# The session adds KWIN_DISABLE_UDMABUF_IMPORT=1 unless the host takes guest udmabufs (QEMU with
# x-guest-dmabuf: crosvm_desktop_guest_dmabuf=1 on the kernel command line): KWin's import attempt
# then only costs host round trips before it copies anyway. Put KWIN_DISABLE_UDMABUF_IMPORT=0 here
# to keep the attempts.
CROSVM_DESKTOP_KWIN_ENV="KWIN_RENDER_JOURNAL_VARIANCE_TIME_MS=100 KWIN_WAYLAND_DEADLINE=1 KWIN_WAYLAND_COMMIT_TIMING=1 KWIN_STEADY_ANIMATION_CLOCK=1 KWIN_ANIMATION_START_STEP=1 KWIN_LONE_FRAME_LEAD_US=2500 KWIN_ASYNC_CURSOR_MOVES=1"

# A new window size (full screen on/off, a drag of the window's edge) reaches this desktop once
# the window has kept it this many ms; meanwhile the old frame is shown scaled, as in QEMU's SDL
# window. At least 1 s between two sizes; none while the edge is being dragged. 0: at once
# (every size an output change for Plasma - several a second made plasmashell crash).
CROSVM_DESKTOP_RESIZE_SETTLE_MS=200

# Huge pages for shared memory in this boot (set at boot by vitrine-nested-boot.service): client
# wl_shm buffers are memfds, and with 4 KiB pages every new buffer of a resizing window costs
# thousands of page faults and a page-by-page zero-copy mapping - within_size gave Konsole and
# Dolphin 33-43 % more images while resizing (2026-10-09). within_size, always, advise, never, or
# keep (the guest's own setting). Takes effect at the next boot.
CROSVM_DESKTOP_SHMEM_HUGEPAGES=within_size

# Extra wl-cross-domain-proxy options, e.g. "--no-clock-translation" (debug only)
CROSVM_DESKTOP_PROXY_ARGS=
