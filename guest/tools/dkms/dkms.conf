# The patched virtio-gpu driver of the vitrine guest tools: the kernel's own
# driver plus vitrine's patches (patches/), rebuilt for every kernel.
PACKAGE_NAME="vitrine-virtio-gpu"
PACKAGE_VERSION="@VERSION@"

# The sources are fetched per kernel by prepare.sh, so the build directory is
# empty until then.
PRE_BUILD="prepare.sh ${kernelver}"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="rm -f *.o *.ko .*.cmd Module.symvers modules.order"

BUILT_MODULE_NAME[0]="virtio-gpu"
# Fedora's dkms puts it in extra/ whatever this says; the depmod.d rule of
# the package makes depmod prefer it to the in-tree driver
DEST_MODULE_LOCATION[0]="/extra"
AUTOINSTALL="yes"
