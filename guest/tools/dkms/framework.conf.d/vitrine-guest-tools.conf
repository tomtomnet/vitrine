# vitrine guest tools: dkms runs its post-transaction command after each
# module it installs or removes, and Fedora's, "dracut --regenerate-all
# --force", makes every kernel's initramfs again each time: an update of the
# tools with three kernels made some twenty (2026-10-30).  The tools' own dkms
# runs (dkms-sync, the package's removal) set VITRINE_DKMS_NO_POST_TRANSACTION
# and make each initramfs once, after all their builds (or the installer
# does).  Other dkms runs, a new kernel's included, keep the command.
if [ -n "${VITRINE_DKMS_NO_POST_TRANSACTION:-}" ]; then
	post_transaction=
fi
