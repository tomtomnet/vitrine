# vitrine guest tools: no spice-vdagent clipboard in a nested-desktop boot.
# The nested desktop shares its clipboard with the host's through its proxy
# (wl-cross-domain-proxy, its window's focus deciding); spice-vdagent and
# vitrine's bridge, which pass the clipboard through QEMU's vdagent, would copy
# the same clipboard back and forth beside it.  A drop-in of the units the
# session's autostart makes of their entries.
[Unit]
ConditionPathExists=!/run/vitrine-nested/nested
