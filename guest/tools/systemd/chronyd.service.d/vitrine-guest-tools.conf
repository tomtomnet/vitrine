# vitrine guest tools: chronyd on the host's clock (KVM's PTP clock) when the
# VM has it, its corrections at 1000 ppm at most (libexec/guest-clock says
# why).  /etc/chrony.conf is read as before, through the include.  An empty
# /etc/systemd/system/chronyd.service.d/vitrine-guest-tools.conf turns this off.
[Service]
# chronyd's own configuration alone when guest-clock did not run
Environment="VITRINE_CLOCK_CONF=include /etc/chrony.conf" VITRINE_CLOCK_REF= VITRINE_CLOCK_STEP= VITRINE_CLOCK_SLEW=
# outside chronyd's sandbox (+): it loads ptp_kvm, which ProtectKernelModules= and the
# capabilities chronyd keeps would refuse; a failure is no failure (-)
ExecStartPre=-+/usr/libexec/vitrine-guest-tools/guest-clock
EnvironmentFile=-/run/vitrine-guest-tools/guest-clock.env
ExecStart=
ExecStart=/usr/sbin/chronyd -n $OPTIONS ${VITRINE_CLOCK_CONF} ${VITRINE_CLOCK_REF} ${VITRINE_CLOCK_STEP} ${VITRINE_CLOCK_SLEW}
