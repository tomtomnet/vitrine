# vitrine guest tools: in a nested-desktop boot, "Plasma (nested desktop)" in
# place of Plasma (XDG_DATA_DIRS: /usr/share/vitrine-guest-tools first, where
# its plasma.desktop is); vitrine-nested-boot.service writes the file in such a
# boot only.  The login screen gets the daemon's XDG_DATA_DIRS too.
[Service]
EnvironmentFile=-/run/vitrine-nested/plasmalogin.env
