# vitrine guest tools: the settings of vitrine's KWin (the guest's compositor
# in a VM; guest/kwin of vitrine).  A stock KWin ignores the ones it does not
# know.  Same-named files in /etc/environment.d or ~/.config/environment.d
# replace this one.
#
# A GL timer query is a round trip to the host through the native context:
# it inflated the render estimate and delayed frames.
KWIN_NO_TIMER_QUERY=1
# One slow frame is forgotten after a second instead of keeping the
# compositor a refresh ahead for longer.
KWIN_RENDER_JOURNAL_VARIANCE_TIME_MS=1000
# A commit whose buffers are not readable yet waits up to 1.2 ms past the
# vblank instead of a whole refresh; the guest driver (flip_grace_us) still
# shows such a flip at the vblank just gone.
KWIN_DRM_COMMIT_GRACE_US=1200
# A lone frame (a key press after an idle stretch) is committed as soon as it
# is rendered instead of at the predicted time.
KWIN_DRM_COMMIT_EARLY=1
# A frame starts 0.3 ms before its render estimate and safety margin demand
# instead of 1 ms on top, on a precise timer.
KWIN_FRAME_SLACK_US=300
# The commit thread tells the frame scheduler when the GPU was done, so the
# render estimate includes the GPU's time without a GL query.
KWIN_DRM_WATCH_GPU=1
# Zero copy (virtio_gpu.blob_flush_fence=3): no rendering into a buffer, nor
# giving a client's back, while the host may still show it.
KWIN_SWAPCHAIN_WAIT_READERS=1
