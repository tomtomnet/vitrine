# vitrine guest tools: the options of the patched virtio-gpu driver (DKMS
# module vitrine-virtio-gpu), as module options rather than kernel arguments,
# so that every kernel gets them.  The stock driver ignores those it does not
# know.  dracut copies this file into the initramfs, where the driver loads.
#
# /etc/modprobe.d/vitrine-virtio-gpu.conf replaces this file: the installer
# writes one with blob_flush_fence=3 when it installed vitrine's KWin.
#
# tiled_scanout=1   zero copy: the planes advertise the GPU's tiled layouts
#                   besides linear, so a fullscreen client's buffers can go to
#                   the plane as they are (read at probe)
# blob_flush_fence  zero copy: the compositor never draws into a buffer the
#                   host still shows.  1: the flip event waits for the host's
#                   release (any compositor); 3: the release goes on the buffer
#                   as a fence instead, for vitrine's KWin, which waits for it
#                   (KWIN_SWAPCHAIN_WAIT_READERS=1); 3 with another KWin makes
#                   the host turn zero copy off
# host_vblank=1     the vblank ticks at the host's display refresh
# flip_grace_us     a flip this late after the host's tick still shows at it
options virtio_gpu tiled_scanout=1 blob_flush_fence=1 host_vblank=1 flip_grace_us=1200

# the vblank interrupt stays on between frames (no re-enable delay); for a
# kernel with drm as a module: Fedora's has it built in, where
# vitrine-kernel-settings.service sets it at boot
options drm vblankoffdelay=0
