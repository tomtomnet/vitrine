# What build.sh builds, in the order it builds it, as Vitrine's Builds
# window shows it.  The app reads this file; build.sh has its own code for
# each component (key_lines, the build steps): a new component needs both.
#
# One [component] section each, then NAME=value lines, no quotes, no shell:
#   title          what the window calls it
#   url, commit    the names of its entries in versions.conf
#   patches        its folder: the *.patch files there and in its folders,
#                  in the C order of their paths, or those its series file
#                  lists (build.sh's patches_of)
#   origin         where the folder's own patches come from;
#   origin.FOLDER  where those of FOLDER/ come from
#   deps           the components it is built against

[virglrenderer]
title=virglrenderer
url=VIRGL_URL
commit=VIRGL_COMMIT
patches=patches/virglrenderer
origin=Research
origin.vitrine=Vitrine

[rutabaga_gfx]
title=rutabaga_gfx
url=RUTABAGA_URL
commit=RUTABAGA_COMMIT
patches=patches/rutabaga_gfx
origin=Research
origin.vitrine=Vitrine
deps=virglrenderer

[qemu]
title=QEMU
url=QEMU_URL
commit=QEMU_COMMIT
patches=patches/qemu
origin.research=Research
origin.vitrine=Vitrine
deps=virglrenderer rutabaga_gfx
