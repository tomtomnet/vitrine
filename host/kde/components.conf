# The host's desktop, as Vitrine's Builds window shows it: optional
# packages of the host's own system, apart from Vitrine's QEMU
# (host/components.conf) and the guest tools.  The app reads this file;
# build.sh builds a package and install.sh installs it (README.md); both read
# the package= lines.  The same NAME=value lines as host/components.conf's:
#   title          what the window calls it
#   kind=system    installed into the host's system, by the administrator,
#                  rather than used from Vitrine's folders
#   package        the source package the research's recipe builds (its
#                  kde_set_for host PACKAGE VERSION)
#   follows        NAME PARTS: the installed package whose version says
#                  which release the distribution has moved to, and how many
#                  parts of it make a release (Plasma 6.7.5, the KDE
#                  Frameworks 6.31); none: the package itself
#   against        what a build must match: the packages whose private API
#                  it uses; the versions it was built against must be the
#                  system's
#   patches        its patches: the series of the research's sets there
#                  (sets/*.series), each set a group
#   origin         where they come from
#   research       the research's commit the copy in research/ is from
#   heavy=1        its build takes up to the container's memory cap: it
#                  waits until that much is free

[host-kwin]
title=KWin
kind=system
package=kwin
follows=plasma-workspace 3
against=qt6-qtbase qt6-qtdeclarative kdecoration libplasma
patches=research/patches/kwin
origin=Research
research=f659cb4d8fcbcb64d9ff5467ca0ba4891d13a28d
heavy=1

[host-ksvg]
title=KSvg
kind=system
package=kf6-ksvg
follows=kf6-kcoreaddons 2
patches=research/patches/ksvg
origin=Research
research=f659cb4d8fcbcb64d9ff5467ca0ba4891d13a28d

[host-kirigami]
title=Kirigami
kind=system
package=kf6-kirigami
follows=kf6-kcoreaddons 2
against=qt6-qtbase qt6-qtdeclarative
patches=research/patches/kirigami
origin=Research
research=f659cb4d8fcbcb64d9ff5467ca0ba4891d13a28d

[host-qtbase]
title=Qt base
kind=system
package=qt6-qtbase
patches=research/patches/qtbase
origin=Research
research=f659cb4d8fcbcb64d9ff5467ca0ba4891d13a28d
heavy=1
