# What host/build.sh builds: each component is fetched at its pinned commit,
# then the patches of patches/<component> are applied (patches/README.md).
#
# One NAME=value per line, no quotes, no shell: build.sh and the app read
# this file, they do not source it.  Changing a line, a patch or build.sh
# makes the app offer to update Vitrine's QEMU.

# Upstream QEMU, master of 2026-10-14: the commit the research's QEMU
# series applies to (patches/qemu/series).  A bare SHA is fetched with
# `git fetch --depth 1 origin <sha>`; upstream's master is not rewritten.
QEMU_URL=https://gitlab.com/qemu-project/qemu.git
QEMU_COMMIT=c61ea024f6d58261394b1b408e0f220e30c136a4

# Upstream virglrenderer, main of 2026-09-28: the research's, which its
# patches in patches/virglrenderer/ apply to
VIRGL_URL=https://gitlab.freedesktop.org/virgl/virglrenderer.git
VIRGL_COMMIT=aafa9bd234a43c31004ec768ce000b21cf7b99ca

# rutabaga_gfx, for virtio-gpu-rutabaga (cross-domain: the nested desktop):
# release 0.1.85, the research's (patches/rutabaga_gfx/BASE.md there)
RUTABAGA_URL=https://github.com/magma-gpu/rutabaga_gfx.git
RUTABAGA_COMMIT=4fb9f32055d8e001cc9450e92db76fc6fc16804e
