# What host/build.sh builds: each component is fetched at its pinned commit,
# then patches/<component>/*.patch are applied in name order.
#
# One NAME=value per line, no quotes, no shell: build.sh and the app read
# this file, they do not source it.  Changing a line, a patch or build.sh
# makes the app offer to update Vitrine's QEMU.

# The user's QEMU fork (qemu-gui), its master of 2026-09-28.  A bare SHA is
# fetched with `git fetch --depth 1 origin <sha>`: if the fork's history is
# rewritten (force-push) and the commit garbage-collected, that fetch fails.
# A tag in the fork would be safer to pin.
QEMU_URL=https://github.com/tomtomnet/qemu-gui.git
QEMU_COMMIT=49fd506758831883132515839a89d2c6238ef796

# Upstream virglrenderer, main of 2026-09-06
VIRGL_URL=https://gitlab.freedesktop.org/virgl/virglrenderer.git
VIRGL_COMMIT=cf6c62da2a1384b194f463e6221371962fe99575
