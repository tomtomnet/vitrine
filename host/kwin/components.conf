# The host's desktop, as Vitrine's Builds window shows it: optional, apart
# from Vitrine's QEMU (host/components.conf) and the guest tools.  The app
# reads this file; build.sh builds the component and install.sh installs
# it (README.md).  The same NAME=value lines as host/components.conf's:
#   title          what the window calls it
#   kind=system    a component installed into the host's system, by the
#                  administrator, rather than used from Vitrine's folders
#   patches        its patches: the series of the research's sets there
#                  (sets/*.series), each set a group
#   origin         where they come from
#   research       the research's commit the copy in research/ is from
#   heavy=1        its build takes up to the container's memory cap
#   minutes        how long a first build takes, until this machine has
#                  built it once

[host-kwin]
title=KWin
kind=system
patches=research/patches/kwin
origin=Research
research=36532330292b8ff9185a0dddf6fbc92a17ea6252
heavy=1
minutes=15
